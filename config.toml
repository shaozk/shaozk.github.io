theme = "tabi"
base_url = "https://shaozk.github.io/"
title = "shaozk"

taxonomies = [
  { name = "categories", feed = true },
  { name = "tags", feed = true },
  { name = "series", feed = true }
]

default_language = "en"
build_search_index = true

[search]
index_format = "elasticlunr_json" # Or the less efficient "elasticlunr_javascript".
include_title = true
include_description = true
include_path = true
include_content = true

[markdown.highlighting]
theme = "catppuccin-frappe"
style = "class"

[extra]
comments = true
katex = true
toc = true

[extra.giscus]
enabled_for_all_posts = true
automatic_loading = true
repo = "shaozk/shaozk.github.io"
repo_id = "R_kgDONGjemA"
category = "Announcements"
category_id = "DIC_kwDONGjemM4DBOA9"
mapping = "slug"
strict_title_matching = 1  # 1 to enable, 0 to disable.
enable_reactions = 1  # 1 to enable, 0 to disable.
comment_box_above_comments = true
light_theme = "noborder_light"
dark_theme = "noborder_dark"
lang = "zh-CN"  # Leave blank to match the page's language.
lazy_loading = true
